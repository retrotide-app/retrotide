name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

env:
  IMAGE: ghcr.io/retrotide-app/retrotide

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Work out the release SHA and version
        id: release
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          version="$(git describe --tags --match 'v*' --always "$HEAD_SHA")"
          echo "Building $HEAD_SHA as $version"
          {
            echo "sha=$HEAD_SHA"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ env.IMAGE }}:${{ steps.release.outputs.sha }}

  staging:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      RELEASE_SHA: ${{ needs.build.outputs.sha }}
      STACK_DIR: ${{ secrets.STAGING_STACK_DIR }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false

      - name: Copy the release to the server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.SERVER_FINGERPRINT }}
          source: docker-compose.prod.yml,deploy
          target: ${{ env.STACK_DIR }}/releases/${{ env.RELEASE_SHA }}

      - name: Deploy the release
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.SERVER_FINGERPRINT }}
          command_timeout: 15m
          envs: STACK_DIR,RELEASE_SHA
          script: bash "$STACK_DIR/releases/$RELEASE_SHA/deploy/deploy.sh" "$STACK_DIR" "$RELEASE_SHA"

  production:
    needs: [build, staging]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      RELEASE_SHA: ${{ needs.build.outputs.sha }}
      STACK_DIR: ${{ secrets.PRODUCTION_STACK_DIR }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false

      - name: Copy the release to the server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.SERVER_FINGERPRINT }}
          source: docker-compose.prod.yml,deploy
          target: ${{ env.STACK_DIR }}/releases/${{ env.RELEASE_SHA }}

      - name: Deploy the release
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.SERVER_FINGERPRINT }}
          command_timeout: 15m
          envs: STACK_DIR,RELEASE_SHA
          script: bash "$STACK_DIR/releases/$RELEASE_SHA/deploy/deploy.sh" "$STACK_DIR" "$RELEASE_SHA"

  tag-production:
    needs: [build, production]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      RELEASE_SHA: ${{ needs.build.outputs.sha }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the release as production and latest, and with its version when it has one
        run: |
          set -euo pipefail
          tags=(--tag "$IMAGE:production" --tag "$IMAGE:latest")
          if [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            tags+=(--tag "$IMAGE:$RELEASE_VERSION")
          fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE:$RELEASE_SHA"
