name: ${STACK:-retrotide}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

networks:
  observability:
    external: true

services:
  postgres:
    image: postgres:18
    container_name: ${STACK:-retrotide}-postgres
    user: postgres
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 60s
    env_file:
      - postgres.env
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    shm_size: 256mb
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: ${POSTGRES_CPUS:-2.0}
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    memswap_limit: ${POSTGRES_MEM_LIMIT:-1g}
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    image: ghcr.io/retrotide-app/retrotide:${IMAGE_TAG:?set IMAGE_TAG to the release tag}
    container_name: ${STACK:-retrotide}-app
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-2412}:4323"
    env_file:
      - .env
    environment:
      LISTEN_ADDR: ":4323"
      LOG_FORMAT: json
      GOMEMLIMIT: ${APP_GOMEMLIMIT:-900MiB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: retrotide
      POSTGRES_DB: retrotide
      VALKEY_URL: redis://valkey:6379
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: ${APP_CPUS:-2.0}
    mem_limit: ${APP_MEM_LIMIT:-1g}
    memswap_limit: ${APP_MEM_LIMIT:-1g}
    pids_limit: 256
    networks:
      - default
      - observability
    labels:
      prometheus-scrape: "true"
      prometheus-job: ${STACK:-retrotide}
      prometheus-port: "4323"
      prometheus-path: "/metrics"

  valkey:
    image: valkey/valkey:latest
    container_name: ${STACK:-retrotide}-valkey
    user: valkey
    restart: unless-stopped
    logging: *default-logging
    command: valkey-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy volatile-lru
    read_only: true
    tmpfs:
      - /data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 0.5
    mem_limit: 384m
    memswap_limit: 384m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: ${STACK:-retrotide}-postgres-exporter
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - postgres.env
    environment:
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "false"
      DATA_SOURCE_URI: postgres:5432/retrotide?sslmode=disable
      DATA_SOURCE_USER: retrotide_monitor
    entrypoint:
      - /bin/sh
      - -c
      - 'export DATA_SOURCE_PASS="$${RETROTIDE_MONITOR_PASSWORD}"; exec /bin/postgres_exporter'
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 0.25
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 64
    networks:
      - default
      - observability
    labels:
      prometheus-scrape: "true"
      prometheus-job: "postgres"
      prometheus-port: "9187"
      prometheus-path: "/metrics"

volumes:
  postgres-data:
